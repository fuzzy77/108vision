# ============================================================
# AIA Platform — Qdrant Configuration
# ============================================================
# Vector database for knowledge base embeddings and semantic search.
# ============================================================

log_level: INFO

storage:
  storage_path: /qdrant/storage
  snapshots_path: /qdrant/snapshots

  # Performance tuning
  optimizers:
    default_segment_number: 2
    max_segment_size_kb: 200000
    memmap_threshold_kb: 50000
    indexing_threshold_kb: 20000
    flush_interval_sec: 5

  # WAL for durability
  wal:
    wal_capacity_mb: 64
    wal_segments_ahead: 0

service:
  host: "0.0.0.0"
  http_port: 6333
  grpc_port: 6334
  enable_tls: false

  # Rate limiting
  max_request_size_mb: 32
  max_workers: 0  # auto-detect

# Telemetry (anonymous usage stats — disable in production)
telemetry_disabled: true
