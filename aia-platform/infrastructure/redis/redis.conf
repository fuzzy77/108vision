# ============================================================
# AIA Platform — Redis Configuration
# ============================================================
# Optimized for session/cache workload with AOF persistence.
# ============================================================

# --- Persistence ---
# AOF (Append Only File) for durability
appendonly yes
appendfsync everysec

# RDB snapshots as secondary backup
save 900 1
save 300 10
save 60 10000

# --- Memory ---
maxmemory 512mb
maxmemory-policy allkeys-lru

# --- Performance ---
# TCP keepalive (seconds)
tcp-keepalive 300

# Disable commands dangerous in production
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""

# --- Logging ---
loglevel notice

# --- Connection ---
timeout 300
tcp-backlog 511

# --- Snapshotting ---
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
