# ============================================================
# AIA Platform — Traefik v3 Static Configuration
# ============================================================
# Production reverse proxy with automatic Let's Encrypt SSL.
# ============================================================

# --- Global ---
global:
  checkNewVersion: false
  sendAnonymousUsage: false

# --- API / Dashboard ---
api:
  dashboard: true
  insecure: false

# --- Entry Points ---
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt
      middlewares:
        - security-headers@file

# --- Providers ---
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: aia-network
    watch: true

  file:
    directory: /etc/traefik/dynamic
    watch: true

# --- Certificate Resolvers ---
certificatesResolvers:
  letsencrypt:
    acme:
      email: "${ACME_EMAIL}"
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

# --- Logging ---
log:
  level: INFO
  format: json

accessLog:
  format: json
  filters:
    statusCodes:
      - "400-599"
    retryAttempts: true
    minDuration: "250ms"

# --- Metrics ---
metrics:
  prometheus:
    entryPoint: websecure
    addEntryPointsLabels: true
    addServicesLabels: true
    addRoutersLabels: true
