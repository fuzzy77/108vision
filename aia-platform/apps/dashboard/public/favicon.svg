<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- 108 Vision — Logo Mark (square, for favicon/avatar) -->
  <rect width="64" height="64" rx="14" fill="#0F172A"/>

  <!-- "108" condensed with infinity accent -->
  <g transform="translate(6, 16)">
    <!-- "1" -->
    <rect x="4" y="6" width="4" height="24" rx="1.5" fill="white"/>
    <rect x="2" y="27" width="8" height="3" rx="1" fill="white"/>

    <!-- "0" — open circle -->
    <circle cx="22" cy="18" r="9" stroke="white" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-dasharray="52 4"/>

    <!-- "8" / infinity -->
    <path d="M34 18c0-4.2 3-8.5 7.2-8.5s7.2 4.3 7.2 8.5-3 8.5-7.2 8.5-7.2-4.3-7.2-8.5zm14.4 0c0-4.2 3-8.5 7.2-8.5" stroke="#A78BFA" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Accent bar bottom -->
  <rect x="12" y="52" width="40" height="3" rx="1.5" fill="#6D28D9"/>
</svg>
