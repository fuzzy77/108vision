version: "3.9"

# Stack applicativo — si somma a docker-compose.yml (infra).
# Postgres è esterno (Neon); Qdrant non esiste più (pgvector in Neon).
services:
  aia-gateway:
    build:
      context: ./repos/108vision/aia-platform
      dockerfile: apps/gateway/Dockerfile
    container_name: aia-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${NEON_DATABASE_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      LITELLM_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY}
      BETTER_AUTH_SECRET: ${AIA_AUTH_SECRET}
      BETTER_AUTH_URL: https://api.${AIA_DOMAIN}
      JWT_SECRET: ${AIA_JWT_SECRET}
      CORS_ALLOWED_ORIGINS: https://www.${AIA_DOMAIN},https://${AIA_DOMAIN},https://app.${AIA_DOMAIN},https://chat.${AIA_DOMAIN}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aia-gateway.rule=Host(`api.${AIA_DOMAIN}`)"
      - "traefik.http.routers.aia-gateway.entrypoints=websecure"
      - "traefik.http.routers.aia-gateway.tls.certresolver=letsencrypt"
      - "traefik.http.services.aia-gateway.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health/live').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 384M

  # Website marketing (www. + apex redirect) + dashboard (app.) + client chat (chat.)
  # + downloads (dl.) in un solo nginx.
  aia-static:
    build:
      # context = radice del repo: deve vedere sia aia-platform/ sia aia-website/
      context: ./repos/108vision
      dockerfile: aia-platform/deploy/static.Dockerfile
    container_name: aia-static
    restart: unless-stopped
    environment:
      AIA_DOMAIN: ${AIA_DOMAIN}
      NGINX_ENVSUBST_FILTER: AIA_DOMAIN
    volumes:
      - /opt/108vision/public/downloads:/usr/share/nginx/html/downloads:ro
    depends_on:
      - aia-gateway
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      # router 1: sito marketing (www. serve, apex → 301 via vhost nginx)
      - "traefik.http.routers.aia-site.rule=Host(`www.${AIA_DOMAIN}`, `${AIA_DOMAIN}`)"
      - "traefik.http.routers.aia-site.entrypoints=websecure"
      - "traefik.http.routers.aia-site.tls.certresolver=letsencrypt"
      # router 2: dashboard
      - "traefik.http.routers.aia-app.rule=Host(`app.${AIA_DOMAIN}`)"
      - "traefik.http.routers.aia-app.entrypoints=websecure"
      - "traefik.http.routers.aia-app.tls.certresolver=letsencrypt"
      # router 3: client chat
      - "traefik.http.routers.aia-chat.rule=Host(`chat.${AIA_DOMAIN}`)"
      - "traefik.http.routers.aia-chat.entrypoints=websecure"
      - "traefik.http.routers.aia-chat.tls.certresolver=letsencrypt"
      # router 4: downloads
      - "traefik.http.routers.aia-dl.rule=Host(`dl.${AIA_DOMAIN}`)"
      - "traefik.http.routers.aia-dl.entrypoints=websecure"
      - "traefik.http.routers.aia-dl.tls.certresolver=letsencrypt"
      - "traefik.http.services.aia-static.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 48M
