<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" fill="none">
  <!-- Proposal J: Gradient Mark — "108" con gradient violet, VISION crisp -->
  <!-- Concept: il numero ha profondita cromatica, il testo e' solido -->

  <defs>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="50%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- "108" with gradient fill -->
  <text x="12" y="64" font-family="Inter, 'SF Pro Display', system-ui, sans-serif" font-size="58" font-weight="900" letter-spacing="-2" fill="url(#violetGrad)">108</text>

  <!-- Thin separator -->
  <rect x="130" y="20" width="1.5" height="50" rx="0.75" fill="#E2E8F0"/>

  <!-- "VISION" — solid dark -->
  <text x="146" y="58" font-family="Inter, 'SF Pro Display', system-ui, sans-serif" font-size="40" font-weight="700" letter-spacing="3" fill="#0F172A">VISION</text>

  <!-- Small dot at the end -->
  <circle cx="368" cy="52" r="4" fill="#6D28D9"/>
</svg>
