<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" fill="none">
  <!-- Proposal F: Clean Pro — "108" numeri leggibili + wordmark Inter -->
  <!-- Concept: "108" chiaro, l'8 in violet come accent, separatore, VISION bold -->

  <!-- "108" as clear readable numbers -->
  <text x="16" y="62" font-family="Inter, 'SF Pro Display', system-ui, sans-serif" font-size="54" font-weight="800" letter-spacing="-2" fill="#0F172A">10</text>
  <text x="78" y="62" font-family="Inter, 'SF Pro Display', system-ui, sans-serif" font-size="54" font-weight="800" letter-spacing="-2" fill="#6D28D9">8</text>

  <!-- Vertical separator -->
  <rect x="118" y="18" width="2.5" height="54" rx="1.25" fill="#E2E8F0"/>

  <!-- "VISION" wordmark -->
  <text x="134" y="62" font-family="Inter, 'SF Pro Display', system-ui, sans-serif" font-size="48" font-weight="700" letter-spacing="2" fill="#0F172A">VISION</text>

  <!-- Subtle accent line under "VISION" -->
  <rect x="134" y="72" width="48" height="3" rx="1.5" fill="#6D28D9"/>
</svg>
