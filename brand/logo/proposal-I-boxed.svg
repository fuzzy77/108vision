<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 90" fill="none">
  <!-- Proposal I: Boxed Number — "108" dentro un badge rettangolare + VISION affiancato -->
  <!-- Concept: il numero diventa un marchio "sigillo", autorevole e premium -->

  <!-- Badge box for "108" -->
  <rect x="8" y="10" width="110" height="70" rx="12" fill="#0F172A"/>
  <text x="28" y="60" font-family="Inter, 'SF Pro Display', system-ui, sans-serif" font-size="44" font-weight="800" letter-spacing="-1" fill="white">108</text>
  <!-- Small violet bar inside badge -->
  <rect x="28" y="66" width="32" height="3" rx="1.5" fill="#A78BFA"/>

  <!-- "VISION" — outside the box, large and clear -->
  <text x="136" y="60" font-family="Inter, 'SF Pro Display', system-ui, sans-serif" font-size="44" font-weight="700" letter-spacing="1" fill="#0F172A">VISION</text>

  <!-- Tagline sotto -->
  <text x="136" y="78" font-family="Inter, 'SF Pro Display', system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="3" fill="#6D28D9">ARCHITETTURA DI DECISIONI</text>
</svg>
