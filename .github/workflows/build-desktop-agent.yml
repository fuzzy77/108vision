name: Build Desktop Agent

on:
  push:
    tags:
      - 'agent-v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build (all, windows, macos, linux)'
        required: false
        default: 'all'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: bun-windows-x64
            output: 108ai-agent.exe
            platform_filter: windows
          - os: ubuntu-latest
            target: bun-linux-x64
            output: 108ai-agent-linux
            platform_filter: linux
          - os: macos-13
            target: bun-darwin-x64
            output: 108ai-agent-macos-x64
            platform_filter: macos
          - os: macos-14
            target: bun-darwin-arm64
            output: 108ai-agent-macos-arm64
            platform_filter: macos

    runs-on: ${{ matrix.os }}

    # Skip if workflow_dispatch selected a specific platform that doesn't match
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == matrix.platform_filter

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: aia-platform/apps/local-agent
        run: bun install --frozen-lockfile || bun install

      - name: Build binary
        working-directory: aia-platform/apps/local-agent
        run: |
          mkdir -p dist/bin
          bun build src/index.ts \
            --compile \
            --target=${{ matrix.target }} \
            --outfile=dist/bin/${{ matrix.output }}

      - name: Verify binary exists
        working-directory: aia-platform/apps/local-agent
        run: ls -lh dist/bin/${{ matrix.output }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: aia-platform/apps/local-agent/dist/bin/${{ matrix.output }}
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries/
          merge-multiple: true

      - name: List downloaded binaries
        run: find binaries/ -type f | head -20

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: binaries/*
          generate_release_notes: true
          draft: false
          name: "Desktop Agent ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
